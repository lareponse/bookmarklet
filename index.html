<script>
  javascript:(function(){
  function pad(n){return n.toString().padStart(2,"0");}
  function toICSDate(dateStr,timeStr){
    const [d,m,y] = dateStr.split("/").map(Number);
    const [hh,mm] = timeStr.split(":").map(Number);
    return y+pad(m)+pad(d)+"T"+pad(hh)+pad(mm)+"00";
  }

  const container = document.querySelector("#divHoraires");
  if(!container){ alert("Pas de divHoraires"); return; }

  const h3 = container.querySelector("h3") ? container.querySelector("h3").innerText.trim() : "planning";
  
  // Conversion "Classe 1-CE-X75-A" → "1X75A"
  let classCode = h3;
  const m = h3.match(/Classe\s*(\d+).*?(X\d+\w)/i);
  if(m){
    classCode = m[1]+m[2].replace(/-/g,"");
  } else {
    classCode = h3.replace(/\s+/g,"_");
  }

  const rows = container.querySelectorAll("table tbody tr");

  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nCALSCALE:GREGORIAN\n";
  let uid=0;

  rows.forEach(tr=>{
    const tds = tr.querySelectorAll("td");
    if(tds.length>=4){
      const date = tds[0].innerText.trim();
      const time = tds[1].innerText.trim();
      const matiere = tds[2].innerText.trim();
      const [start,end] = time.split("->").map(s=>s.trim());
      const isExam = tr.classList.contains("row_negatif");
      const dtstart = toICSDate(date,start);
      const dtend   = toICSDate(date,end);
      const summary = classCode+"-"+matiere+(isExam?"-EX":"");

      ics += "BEGIN:VEVENT\n";
      ics += "UID:"+(uid++)+"@"+classCode+"\n";
      ics += "DTSTART;TZID=Europe/Brussels:"+dtstart+"\n";
      ics += "DTEND;TZID=Europe/Brussels:"+dtend+"\n";
      ics += "SUMMARY:"+summary+"\n";
      ics += "END:VEVENT\n";
    }
  });

  ics += "END:VCALENDAR";

  // téléchargement
  const blob = new Blob([ics], {type:"text/calendar"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = classCode+".ics";
  a.click();
  URL.revokeObjectURL(url);
})();

</script>

<script>
  javascript:(function(){
  function pad(n){return n.toString().padStart(2,"0");}
  function toICSDate(dateStr,timeStr){
    const [d,m,y] = dateStr.split("/").map(Number);
    const [hh,mm] = timeStr.split(":").map(Number);
    return y+pad(m)+pad(d)+"T"+pad(hh)+pad(mm)+"00";
  }

  const container = document.querySelector("#divHoraires");
  if(!container){ alert("Pas de divHoraires"); return; }

  const h3 = container.querySelector("h3") ? container.querySelector("h3").innerText.trim() : "planning";

  // Conversion "Classe 1-CE-X75-A" → "1X75A"
  let classCode = h3;
  const m = h3.match(/Classe\s*(\d+).*?(X\d+\w)/i);
  if(m){
    classCode = m[1]+m[2].replace(/-/g,"");
  } else {
    classCode = h3.replace(/\s+/g,"_");
  }

  const rows = Array.from(container.querySelectorAll("table tbody tr"));

  // Regroupement par clé (date+matière+exam)
  const grouped = {};
  rows.forEach(tr=>{
    const tds = tr.querySelectorAll("td");
    if(tds.length>=4){
      const date = tds[0].innerText.trim();
      const time = tds[1].innerText.trim();
      const [start,end] = time.split("->").map(s=>s.trim());
      const matiere = tds[2].innerText.trim();
      const isExam = tr.classList.contains("row_negatif");
      const key = date+"|"+matiere+"|"+isExam;
      if(!grouped[key]){
        grouped[key] = {date,matiere,isExam,start,end};
      } else {
        // Mettre à jour la borne temporelle
        if(start < grouped[key].start) grouped[key].start = start;
        if(end   > grouped[key].end)   grouped[key].end   = end;
      }
    }
  });

  // Génération ICS
  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nCALSCALE:GREGORIAN\n";
  let uid = 0;
  for(const key in grouped){
    const g = grouped[key];
    const dtstart = toICSDate(g.date,g.start);
    const dtend   = toICSDate(g.date,g.end);
    const summary = classCode+"-"+g.matiere+(g.isExam?"-EX":"");
    ics += "BEGIN:VEVENT\n";
    ics += "UID:"+(uid++)+"@"+classCode+"\n";
    ics += "DTSTART;TZID=Europe/Brussels:"+dtstart+"\n";

    ics += "END:VEVENT\n";
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.download = classCode+".ics";
  a.click();
  URL.revokeObjectURL(url);
})();

</script>
